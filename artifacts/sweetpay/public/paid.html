<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SweetPay — تم الدفع بنجاح</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: radial-gradient(circle at center, #ffffff 0%, #dcfce7 100%);
        padding: 16px;
      }
      .card {
        background: linear-gradient(145deg, #f0fdf4 0%, #dcfce7 60%, #bbf7d0 100%);
        border-radius: 28px;
        padding: 52px 44px;
        max-width: 460px;
        width: 100%;
        box-shadow: 0 24px 70px rgba(0,0,0,0.22), 0 0 0 1.5px rgba(34,197,94,0.3);
        text-align: center;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 22px;
      }
      .icon {
        width: 88px;
        height: 88px;
        border-radius: 50%;
        background: linear-gradient(135deg, #22c55e, #16a34a);
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 6px 30px rgba(34,197,94,0.5), 0 0 0 8px rgba(34,197,94,0.12);
        font-size: 42px;
        color: #fff;
        font-weight: 900;
        line-height: 1;
      }
      h1 {
        font-size: 1.5rem;
        font-weight: 900;
        color: #14532d;
        line-height: 1.3;
        letter-spacing: -0.4px;
      }
      .divider {
        width: 56px;
        height: 3.5px;
        border-radius: 99px;
        background: linear-gradient(90deg, #22c55e, #16a34a);
      }
      p {
        font-size: 1.05rem;
        color: #166534;
        line-height: 1.9;
        font-weight: 500;
      }
      p strong {
        color: #14532d;
        font-weight: 800;
        font-size: 1.1rem;
      }
      .badge {
        padding: 12px 32px;
        background: linear-gradient(135deg, rgba(34,197,94,0.15), rgba(22,163,74,0.15));
        border: 1.5px solid rgba(34,197,94,0.4);
        border-radius: 99px;
        font-size: 0.9rem;
        color: #15803d;
        font-weight: 700;
        letter-spacing: 0.4px;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .badge span { font-size: 16px; }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="icon">✓</div>
      <h1>تم الدفع بنجاح</h1>
      <div class="divider"></div>
      <p>
        تم استلام دفعتكم بنجاح.
        <br />
        <strong>يرجى الانتظار حتى يتم قبول طلبكم</strong>
        <br />
        وسيتم إخطاركم فور الموافقة عليه.
      </p>
      <div class="badge">
        <span>✅</span>
        الدفع مؤكد · قيد المراجعة
      </div>
    </div>
  </body>
</html>
